<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06452F">
<title>院内アプリ メニュー｜荻窪ツイン動物病院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     配色＝ラマルクのロゴ色（深緑 → 銅色）
       深緑 ≈ #005038–#006040 ／ 銅色 ≈ #D87828（ロゴ原本から実測）
     アイコン＝Phosphor Icons duotone（MIT）を Iconify から取得し直接埋め込み
       ＝公式HP（ogikubo-animal.com）と同じ書体・同じ淡色10色（site/ICON_POLICY.md）
     ============================================================ */
  :root{
    --green:#0B5B41;
    --green-deep:#06452F;
    --green-night:#043626;
    --green-bright:#157A57;
    --mint:#B8D8C8;

    --copper:#D9782A;
    --copper-light:#F0A564;
    --copper-pale:#F8C79B;

    --tile:#FFFFFF;
    --ink:#16302A;
    --muted:#5F7A70;

    --on-green:#FFFFFF;
    --on-green-2:rgba(255,255,255,.78);

    --shadow-tile:0 1px 0 rgba(255,255,255,.35) inset, 0 10px 30px rgba(2,30,20,.35), 0 2px 6px rgba(2,30,20,.25);
    --shadow-tile-hover:0 1px 0 rgba(255,255,255,.5) inset, 0 22px 48px rgba(2,30,20,.45), 0 4px 10px rgba(2,30,20,.3);
    --r-tile:24px;
    --r-icon:19px;

    --font:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --tile:#132620;
      --ink:#E9F2ED;
      --muted:#9DB5AA;
      --shadow-tile:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.45);
      --shadow-tile-hover:0 1px 0 rgba(255,255,255,.1) inset, 0 22px 48px rgba(0,0,0,.55);
    }
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:var(--green-deep); }
  body{
    margin:0; font-family:var(--font); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100dvh; position:relative; overflow-x:hidden;
    /* 上から下まで一枚の深緑（ヘッダーとタイル領域の境目を作らない） */
    background:
      radial-gradient(90% 60% at 0% 0%, rgba(21,122,87,.55) 0%, rgba(21,122,87,0) 60%),
      radial-gradient(70% 50% at 100% 8%, rgba(217,120,42,.22) 0%, rgba(217,120,42,0) 60%),
      linear-gradient(180deg, #06452F 0%, #0A553C 45%, #06452F 100%);
    background-attachment:scroll;
  }
  a{ color:inherit; }

  /* ---------- 背景の飾り：ロゴの「2本の上昇する矢印」を銅色の大きな帯に ---------- */
  .deco{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .deco svg{ position:absolute; display:block; }
  .deco .arc-top{ right:-12vw; top:-4vw; width:min(640px, 110vw); }
  .deco .arc-bottom{ left:-30vw; bottom:-6vw; width:min(900px, 150vw); opacity:.55; }
  @media (min-width:900px){ .deco .arc-top{ right:-6vw; top:-8vw; width:min(760px, 60vw); } .deco .arc-bottom{ left:-10vw; width:min(1100px, 80vw); } }

  .page{ position:relative; z-index:1; }

  /* ---------- ヘッダー ---------- */
  .hero{
    color:var(--on-green);
    padding: calc(30px + env(safe-area-inset-top)) 20px 22px;
  }
  .hero-in{ max-width:960px; margin:0 auto; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--mint); margin:0 0 14px;
  }
  .eyebrow::before{
    content:""; width:9px; height:9px; border-radius:50%;
    background:var(--copper); box-shadow:0 0 0 4px rgba(217,120,42,.28);
  }
  .hero h1{
    margin:0; font-size:clamp(30px, 7.4vw, 44px); font-weight:900; line-height:1.12; letter-spacing:.01em;
    text-shadow:0 2px 18px rgba(0,0,0,.18);
  }
  .hero h1 small{
    display:block; font-size:clamp(14px, 3.7vw, 18px); font-weight:700; color:var(--on-green-2);
    margin-top:8px; letter-spacing:.06em;
  }
  .rule{ /* 銅色のルール：ロゴの銅を強く */
    width:72px; height:5px; border-radius:5px; margin:16px 0 14px;
    background:linear-gradient(90deg, var(--copper) 0%, var(--copper-light) 100%);
    box-shadow:0 0 18px rgba(217,120,42,.55);
  }
  .hero p{ margin:0; font-size:14px; color:var(--on-green-2); }

  /* ---------- 本体 ---------- */
  .sheet{ max-width:960px; margin:0 auto; padding:0 14px calc(44px + env(safe-area-inset-bottom)); }

  /* 絞り込みチップ：選択＝銅色 */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:6px 2px 16px; margin:0 -2px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; appearance:none; border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.10); color:#fff; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font:inherit; font-size:13px; font-weight:700; padding:9px 15px; border-radius:999px;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .chip:active{ transform:scale(.97); }
  .chip[aria-pressed="true"]{
    background:linear-gradient(135deg, var(--copper), #E88E3E); color:#fff; border-color:transparent;
    box-shadow:0 6px 18px rgba(217,120,42,.45);
  }
  .chip:focus-visible{ outline:3px solid var(--copper-pale); outline-offset:2px; }

  /* タイルのグリッド（深緑の上に白いカード） */
  .grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  @media (min-width:560px){ .grid{ grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; } }
  @media (min-width:820px){ .grid{ grid-template-columns:repeat(5, minmax(0,1fr)); gap:16px; } }

  .tile{
    --c:#5b93bf;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-decoration:none; background:var(--tile);
    border-radius:var(--r-tile); padding:18px 8px 15px; min-height:134px;
    box-shadow:var(--shadow-tile);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
    position:relative; overflow:hidden; isolation:isolate;
  }
  .tile::after{ /* 下端の銅色ライン：常時うっすら → hoverで全幅 */
    content:""; position:absolute; left:50%; bottom:0; width:34%; height:4px; border-radius:4px 4px 0 0;
    background:linear-gradient(90deg, var(--copper), var(--copper-light)); transform:translateX(-50%);
    opacity:.85; transition:width .22s cubic-bezier(.2,.8,.2,1), opacity .2s;
  }
  .tile:hover, .tile:focus-visible{ transform:translateY(-4px); box-shadow:var(--shadow-tile-hover); }
  .tile:hover::after, .tile:focus-visible::after{ width:100%; opacity:1; }
  .tile:active{ transform:translateY(0) scale(.97); transition-duration:.08s; }
  .tile:focus-visible{ outline:3px solid var(--copper-pale); outline-offset:2px; }
  .tile[hidden]{ display:none; }

  .ic{
    width:64px; height:64px; border-radius:var(--r-icon); display:grid; place-items:center;
    color:var(--c); background:color-mix(in srgb, var(--c) 14%, var(--tile));
    transition:transform .18s, background .18s;
  }
  @supports not (background:color-mix(in srgb, red 10%, white)){ .ic{ background:rgba(127,127,127,.12); } }
  .tile:hover .ic, .tile:focus-visible .ic{ transform:scale(1.06); background:color-mix(in srgb, var(--c) 22%, var(--tile)); }
  .ic svg{ width:40px; height:40px; display:block; }

  .lb{
    font-size:13.5px; font-weight:700; line-height:1.3; text-align:center; color:var(--ink);
    letter-spacing:.01em; white-space:pre-line;
  }
  @media (min-width:560px){ .lb{ font-size:14px; } .tile{ min-height:142px; padding-top:20px; } .ic{ width:68px; height:68px; } .ic svg{ width:42px; height:42px; } }

  /* フッター */
  .foot{ margin-top:30px; text-align:center; }
  .more{
    display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    font-size:14px; font-weight:700; color:#fff;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:13px 20px; border-radius:999px; transition:transform .15s, background .15s;
  }
  .more:hover{ transform:translateY(-2px); background:rgba(255,255,255,.16); }
  .more svg{ width:18px; height:18px; color:var(--copper-light); }
  .note{ margin:18px 0 0; font-size:12px; color:var(--on-green-2); }
  .note b{ color:var(--copper-pale); font-weight:700; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<script>
(function(){
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var KEY = 'clinic-app-guides.role';
  function apply(role){
    chips.forEach(function(c){ c.setAttribute('aria-pressed', String(c.dataset.role === role)); });
    tiles.forEach(function(t){
      var ok = role === 'all' || (' ' + t.dataset.roles + ' ').indexOf(' ' + role + ' ') >= 0;
      if (ok) t.removeAttribute('hidden'); else t.setAttribute('hidden', '');
    });
    try { localStorage.setItem(KEY, role); } catch(e){}
  }
  chips.forEach(function(c){ c.addEventListener('click', function(){ apply(c.dataset.role); }); });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved && chips.some(function(c){ return c.dataset.role === saved; })) apply(saved);
})();
</script>
