<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06452F">
<title>院内アプリ メニュー｜荻窪ツイン動物病院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ラマルクのロゴ色（深緑 → 銅色）に合わせた配色
     深緑 ≈ #005038–#006040 ／ 銅色 ≈ #D87828（ロゴ原本から実測）
     ============================================================ */
  :root{
    --green:#0B5B41;
    --green-deep:#06452F;
    --green-bright:#157A57;
    --green-ink:#0F3B2E;
    --green-soft:#E4F0EA;
    --green-soft-2:#CFE3D8;
    --mint:#B8D8C8;

    --copper:#D9782A;
    --copper-ink:#B45E1C;
    --copper-soft:#FBEADB;

    --paper:#F3F7F4;
    --tile:#FFFFFF;
    --ink:#16302A;
    --muted:#5F7A70;
    --line:rgba(11,91,65,.10);
    --link:var(--green);

    --shadow-tile:0 1px 2px rgba(6,69,47,.05), 0 10px 28px rgba(6,69,47,.07);
    --shadow-tile-hover:0 2px 4px rgba(6,69,47,.06), 0 18px 40px rgba(6,69,47,.14);
    --r-tile:22px;
    --r-icon:20px;

    --font:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0E1A16;
      --tile:#172622;
      --ink:#E7F0EB;
      --muted:#93ABA1;
      --line:rgba(184,216,200,.12);
      --green-soft:rgba(21,122,87,.18);
      --green-soft-2:rgba(21,122,87,.30);
      --green-bright:#2E9C74;
      --link:#5FC39A;
      --shadow-tile:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
      --shadow-tile-hover:0 2px 4px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.45);
    }
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; font-family:var(--font); color:var(--ink); background:var(--paper);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  a{ color:inherit; }

  /* ---------- ヘッダー（深緑の帯 ＋ 銅色の上昇カーブ） ---------- */
  .hero{
    position:relative; overflow:hidden; color:#fff;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(217,120,42,.22) 0%, rgba(217,120,42,0) 55%),
      linear-gradient(135deg, #06452F 0%, #0B5B41 55%, #0F6B4C 100%);
    padding: calc(28px + env(safe-area-inset-top)) 20px 64px;
  }
  .hero svg.arcs{
    position:absolute; right:-40px; top:-30px; width:min(420px, 78vw); height:auto;
    pointer-events:none; opacity:.95;
  }
  .hero-in{ max-width:960px; margin:0 auto; position:relative; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--mint);
    margin:0 0 12px;
  }
  .eyebrow::before{
    content:""; width:8px; height:8px; border-radius:50%;
    background:var(--copper); box-shadow:0 0 0 4px rgba(217,120,42,.25);
  }
  .hero h1{
    margin:0; font-size:clamp(26px, 6.4vw, 38px); font-weight:900; line-height:1.18; letter-spacing:.01em;
  }
  .hero h1 small{
    display:block; font-size:clamp(14px, 3.6vw, 18px); font-weight:700; color:rgba(255,255,255,.82);
    margin-top:6px; letter-spacing:.04em;
  }
  .hero p{ margin:14px 0 0; font-size:14px; color:rgba(255,255,255,.78); }

  /* ---------- 本体（ヘッダーに少し重ねる） ---------- */
  .sheet{
    max-width:960px; margin:-36px auto 0; padding:0 14px calc(40px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* 絞り込みチップ */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:6px 2px 14px; margin:0 -2px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; appearance:none; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.16); color:#fff; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font:inherit; font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px;
    cursor:pointer; transition:background .15s, color .15s, border-color .15s, transform .1s;
  }
  .chip:active{ transform:scale(.97); }
  .chip[aria-pressed="true"]{ background:#fff; color:var(--green-deep); border-color:#fff; }
  .chip:focus-visible{ outline:3px solid var(--copper); outline-offset:2px; }

  /* タイルのグリッド */
  .grid{
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px;
  }
  @media (min-width:560px){ .grid{ grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; } }
  @media (min-width:820px){ .grid{ grid-template-columns:repeat(5, minmax(0,1fr)); gap:16px; } }

  .tile{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:10px;
    text-decoration:none; background:var(--tile); border:1px solid var(--line);
    border-radius:var(--r-tile); padding:18px 8px 14px; min-height:132px;
    box-shadow:var(--shadow-tile);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, border-color .18s;
    position:relative; isolation:isolate;
  }
  .tile::after{ /* 下端の銅色アクセント（hoverで伸びる） */
    content:""; position:absolute; left:50%; bottom:0; width:0; height:3px; border-radius:3px 3px 0 0;
    background:linear-gradient(90deg, var(--copper), #EFA262); transform:translateX(-50%);
    transition:width .22s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover, .tile:focus-visible{ transform:translateY(-3px); box-shadow:var(--shadow-tile-hover); border-color:var(--green-soft-2); }
  .tile:hover::after, .tile:focus-visible::after{ width:46%; }
  .tile:active{ transform:translateY(0) scale(.97); transition-duration:.08s; }
  .tile:focus-visible{ outline:3px solid var(--copper); outline-offset:2px; }
  .tile[hidden]{ display:none; }

  .ic{
    width:62px; height:62px; border-radius:var(--r-icon); display:grid; place-items:center;
    background:var(--green-soft); color:var(--green);
    transition:background .18s, color .18s, transform .18s;
  }
  .tile:hover .ic, .tile:focus-visible .ic{ background:var(--green); color:#fff; transform:scale(1.04); }
  .ic svg{ width:34px; height:34px; display:block; }
  .ic svg *{ vector-effect:non-scaling-stroke; }
  .ic path, .ic rect, .ic circle{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .ic .ac{ fill:var(--copper); stroke:none; }            /* 銅色：塗り */
  .ic .acs{ stroke:var(--copper); fill:none; }           /* 銅色：線 */
  .tile:hover .ic .acs, .tile:focus-visible .ic .acs{ stroke:#F4B27A; }
  .tile:hover .ic .ac, .tile:focus-visible .ic .ac{ fill:#F4B27A; }

  .lb{
    font-size:13.5px; font-weight:700; line-height:1.3; text-align:center; color:var(--ink);
    letter-spacing:.01em; white-space:pre-line;
  }
  @media (min-width:560px){ .lb{ font-size:14px; } .tile{ min-height:140px; padding-top:20px; } .ic{ width:66px; height:66px; } .ic svg{ width:36px; height:36px; } }

  /* フッター */
  .foot{ margin-top:28px; text-align:center; }
  .more{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    font-size:14px; font-weight:700; color:var(--link); background:var(--tile);
    border:1.5px solid var(--green-soft-2); padding:12px 18px; border-radius:999px;
    box-shadow:var(--shadow-tile); transition:transform .15s, box-shadow .15s, background .15s;
  }
  .more:hover{ transform:translateY(-2px); box-shadow:var(--shadow-tile-hover); }
  .more svg{ width:18px; height:18px; }
  .note{ margin:18px 0 0; font-size:12px; color:var(--muted); }
  .note b{ color:var(--copper-ink); font-weight:700; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header class="hero">

  <svg class="arcs" viewBox="0 0 420 300" aria-hidden="true" focusable="false">

        <stop offset="0" stop-color="#B8D8C8" stop-opacity="0"/>
        <stop offset="1" stop-color="#B8D8C8" stop-opacity=".45"/>
      </linearGradient>
    </defs>
    <path d="M-10 300 C 120 280, 220 220, 300 120 S 380 40, 420 10" fill="none" stroke="url(#cu)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-10 340 C 140 330, 250 270, 330 170 S 400 90, 440 60" fill="none" stroke="url(#mn)" stroke-width="5" stroke-linecap="round"/>

    <p class="note">スマホ・院外からも見られます ｜ ガイドの追加・修正は<b>院長</b>まで</p>

</main>

<script>
(function(){
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var KEY = 'clinic-app-guides.role';
  function apply(role){
    chips.forEach(function(c){ c.setAttribute('aria-pressed', String(c.dataset.role === role)); });
    tiles.forEach(function(t){
      var ok = role === 'all' || (' ' + t.dataset.roles + ' ').indexOf(' ' + role + ' ') >= 0;
      if (ok) t.removeAttribute('hidden'); else t.setAttribute('hidden', '');
    });
    try { localStorage.setItem(KEY, role); } catch(e){}
  }
  chips.forEach(function(c){ c.addEventListener('click', function(){ apply(c.dataset.role); }); });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved && chips.some(function(c){ return c.dataset.role === saved; })) apply(saved);
})();
</script>
</body>
